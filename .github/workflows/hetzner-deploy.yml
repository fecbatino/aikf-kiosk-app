name: Test and deploy to Hetzner

on:
  push:
    branches: [main]

# Zwei Merges kurz hintereinander starteten bisher zwei parallele Deploys; der
# zweite lief in "container name ... is already in use" (16:12 am 2026-11-02).
# Diese Gruppe serialisiert sie: der laufende Deploy bleibt, der naechste wartet,
# und von mehreren wartenden gewinnt der juengste (cancel-in-progress: false).
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: /opt/stacks/aikf-kiosk-app/deploy.sh
