name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 159.69.204.155
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: bash /opt/stacks/aikf-kiosk-app/deploy.sh
